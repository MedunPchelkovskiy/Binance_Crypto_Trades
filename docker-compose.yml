services:
  producer:
    image: pchelkovskiy/my-producer
    container_name: binance-stream-producer
    environment:
      STREAM_URL: wss://stream.binance.com:9443/stream
      KAFKA_BROKER_ADDRESS: kafka:29092
    restart: unless-stopped
    depends_on:
      - kafka
    networks:
      - trades_stream_network


  kafka:
    image: apache/kafka:latest
    container_name: trades-stream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped

    networks:
      - trades_stream_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: trades-stream-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: trades-stream-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

    restart: unless-stopped

    networks:
      - trades_stream_network

  minio:
    image: minio/minio:latest
    container_name: trades-stream-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - trades_stream_network

volumes:
  kafka_data:
  minio_data:

networks:
  trades_stream_network:
    name: trades_stream_network
