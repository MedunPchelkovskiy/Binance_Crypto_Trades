name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ---- Service 1: TODO (напр. ingestion / producer) ----
  build-my-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_files/requirements.txt

      - name: Run lint
        working-directory: ingestion
        run: ruff check .

      - name: Check syntax
        working-directory: ingestion
        run: python -m compileall .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile.producer
          push: true
          tags: pchelkovskiy/my-producer:latest

  # ---- Service 2: TODO (напр. bronze consumer) ----
