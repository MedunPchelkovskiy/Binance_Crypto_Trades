global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus_streaming
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: stream-producer
    static_configs:
      - targets:
          - producer:8003
#           - host.docker.internal:8003
  - job_name: minio-bronze-consumer
    static_configs:
      - targets:
          - bronze_minio_consumer:8004
#           - host.docker.internal:8003

#  - job_name: silver-consumer
#    static_configs:
#      - targets:
#          - silver-consumer:8000
