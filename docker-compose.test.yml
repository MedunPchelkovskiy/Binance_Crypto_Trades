services:
  # tests/integration/docker-compose.test.yml
  # Test stack: same images as the project's docker-compose.yml, but on separate
  # host ports (1xxxx), no volumes and no restart policy, so it can run next to
  # the dev stack and leaves nothing behind (`down -v` removes everything).

  name: it_trades

  services:

    kafka:
      image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
      ports:
        - "19092:19092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:9093
        # EXTERNAL must advertise the HOST port, otherwise clients on the host
        # connect to the bootstrap address and are then redirected to a wrong one.
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    schema-registry:
      image: confluentinc/cp-schema-registry:7.5.0
      ports:
        - "18081:8081"
      environment:
        SCHEMA_REGISTRY_HOST_NAME: schema-registry
        SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
        SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      depends_on:
        - kafka

    clickhouse:
      image: clickhouse/clickhouse-server@sha256:fa394da808cc53f76d0344429421d6c422a6ee85fe7450135c0e3cff4df9bcbb
      ports:
        - "18123:8123"
      environment:
        CLICKHOUSE_DB: trades
        CLICKHOUSE_USER: default
        CLICKHOUSE_PASSWORD: ""
        CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    minio:
      image: minio/minio:latest
      command: server /data --console-address ":9001"
      ports:
        - "19000:9000"
      environment:
        MINIO_ROOT_USER: testaccesskey
        MINIO_ROOT_PASSWORD: testsecretkey123